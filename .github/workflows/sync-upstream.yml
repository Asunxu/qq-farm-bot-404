name: Sync Upstream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/xxxscarlxrd404/qq-farm-bot.git

      - name: Fetch upstream
        run: git fetch upstream --prune

      - name: Check if already in sync
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already up to date
        if: steps.check.outputs.in_sync == 'true'
        run: echo "HEAD already contains upstream/main, nothing to do."

      - name: Configure custom merge driver
        # 让 .gitattributes 中标记 merge=ours 的自定义前端 UI 路径在合并时保留本仓库版本
        run: git config merge.ours.driver true

      - name: Merge upstream/main
        id: merge
        if: steps.check.outputs.in_sync == 'false'
        run: |
          git config user.name "Asunxu"
          git config user.email "asunxu@users.noreply.github.com"
          git merge upstream/main --no-edit

      - name: Push merged result
        if: steps.check.outputs.in_sync == 'false' && steps.merge.outcome == 'success'
        run: git push origin main

      - name: Report conflict
        if: steps.check.outputs.in_sync == 'false' && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          echo "::error::上游合并冲突，已停止推送，需手动解决：${CONFLICTS}"
          gh issue create \
            --title "上游同步冲突，需要手动处理" \
            --body "## 上游同步冲突

          自动合并上游 https://github.com/xxxscarlxrd404/qq-farm-bot 的 main 时发生冲突，已中止本次同步（未推送任何内容）。

          ### 冲突文件
          \`\`\`
          ${CONFLICTS}
          \`\`\`

          ### 解决方法
          在本地克隆中执行：

          \`\`\`bash
          git fetch upstream
          git merge upstream/main
          # 逐个解决冲突文件后
          git add <冲突文件>
          git commit
          git push origin main
          \`\`\`

          冲突通常来自上游改动了本仓库自定义的登录/卡密/后台管理相关文件。"
